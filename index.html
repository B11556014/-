<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>墨栖服飾｜購物前台</title>
<style>
:root{--brown:#5c4540;--cream:#f8f5f2;--accent:#b58c78;--ink:#342d2a;--line:#e7ddd6}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,"Microsoft JhengHei",sans-serif}
header{background:var(--brown);color:#fff;padding:22px 5%;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
header h1{margin:0;font-size:27px;letter-spacing:3px}nav{display:flex;gap:16px;flex-wrap:wrap}nav a{color:#fff;text-decoration:none}
main{max-width:1100px;margin:28px auto;padding:0 18px}.hero{background:#e9ded5;padding:42px 24px;text-align:center;border-radius:14px;margin-bottom:28px}
.hero h2{font-size:30px;margin:0 0 10px}.section{background:#fff;padding:24px;border-radius:14px;margin:22px 0;box-shadow:0 3px 14px #4a30200d}
h2{margin-top:0;color:var(--brown)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}
.product{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}

.product img {
    width: 100%;
    height: 190px;
    object-fit: contain;
    display: block;
    background: #fff;
    border-radius: 8px;
    margin: 0 auto 15px;
}
.price{font-weight:bold;color:#946b58}
button{background:var(--brown);color:white;border:0;border-radius:8px;padding:11px 16px;cursor:pointer;font-size:15px}
button.secondary{background:#eee;color:var(--ink)}button:disabled{opacity:.5;cursor:not-allowed}
.product .detail-btn{background:#a98572}.product img,.product h3{cursor:pointer}
dialog{width:min(92%,560px);border:0;border-radius:16px;padding:24px;box-shadow:0 12px 45px #0003;color:var(--ink)}
dialog::backdrop{background:#21191699}
.detail-image{width:100%;max-height:320px;object-fit:contain;background:#f4f0ed;border-radius:10px}
.detail-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
input,select,textarea{width:100%;padding:11px;border:1px solid #d9cec7;border-radius:8px;margin:6px 0 14px;font:inherit}
label{font-weight:600}.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.small{color:#776b65;font-size:13px}.status{display:inline-block;background:#f4e7d8;color:#79583f;padding:5px 10px;border-radius:30px;font-size:13px}
.order{border:1px solid var(--line);padding:16px;border-radius:10px;margin:12px 0}.order h3{margin:0 0 8px}
#memberPanel{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#memberPanel span{margin-right:auto}
footer{text-align:center;color:#85766e;padding:30px}
@media(max-width:600px){header{align-items:flex-start}header h1{font-size:22px}.hero h2{font-size:24px}.section{padding:17px}}
</style>
</head>
<body>
<header>
  <h1>墨栖服飾 MOXI</h1>
  <nav>
    <a href="#products">商品專區</a><a href="#member">會員登入</a><a href="#orders">我的訂單</a><a href="#cart">購物車</a>
  </nav>
</header>
<main>
  <section class="hero">
    <h2>穿出自己的風格</h2>
    <p>簡約日常，打造專屬於你的穿搭。</p>
  </section>

  <section class="section" id="member">
    <h2>會員專區</h2>
    <div id="signedIn" hidden>
      <div id="memberPanel"><span id="welcome"></span><button class="secondary" id="logoutBtn">會員登出</button></div>
    </div>
    <div id="authForms" class="form-grid">
      <form id="registerForm">
        <h3>會員註冊</h3>
        <label>會員姓名</label><input id="regName" required maxlength="60" placeholder="請輸入姓名">
        <label>會員帳號（限英文及數字）</label><input id="regAccount" required pattern="[A-Za-z0-9]+" autocomplete="username" placeholder="例如 moxi123">
        <label>會員密碼（至少6碼）</label><input id="regPassword" type="password" required minlength="6" autocomplete="new-password">
        <button type="submit">註冊會員</button>
      </form>
      <form id="loginForm">
        <h3>會員登入</h3>
        <label>會員帳號</label><input id="loginAccount" required pattern="[A-Za-z0-9]+" autocomplete="username">
        <label>會員密碼</label><input id="loginPassword" type="password" required autocomplete="current-password">
        <button type="submit">登入會員</button>
      </form>
    </div>
    <p class="small">註冊資料會保存於雲端帳戶；關閉網頁後可再次登入，不必重新註冊。</p>
    <p id="authMessage" role="status"></p>
  </section>

  <section class="section" id="products">
    <h2>商品專區</h2>
    <div id="productList" class="grid"></div>
  </section>
<div class="product" data-category="上衣" data-name="簡約黑色上衣">
    <img src="images/black.jpg" alt="黑色上衣"
>
    <h3>簡約黑色上衣</h3>
    <p class="price">$490</p>
    <button onclick="addCart('簡約黑色上衣',490)">加入購物車</button>
</div>
<div class="product" data-category="褲子" data-name="休閒牛仔褲">
    <img src="images/jean.jpg" alt="休閒牛仔褲">
    <h3>休閒牛仔褲</h3>
    <p class="price">$890</p>
    <button onclick="addCart('休閒長褲',890)">加入購物車</button>
</DIV>
<div class="product" data-category="裙子" data-name="百褶裙">
    <img src="images/skirt.jpg" alt="百褶裙">
    <h3>百褶裙</h3>
    <p class="price">$690</p>
    <button onclick="addCart('百褶裙',690)">加入購物車</button>
</DIV>
<div class="product" data-category="外套" data-name="休閒外套">
    <img src="images/coat.jpg" alt="休閒外套">
    <h3>休閒外套</h3>
    <p class="price">$1290</p>
    <button onclick="addCart('休閒外套',1290)">加入購物車</button>
</DIV>
  <dialog id="productDialog" aria-labelledby="detailName">
    <button type="button" class="secondary" id="closeProductDialog" style="float:right">關閉 ✕</button>
    <div id="productDetailContent"></div>
  </dialog>

  <section class="section" id="cart">
    <h2>購物車</h2>
    <div id="cartItems">目前尚未選購商品</div>
    <h3>總金額：$<span id="cartTotal">0</span></h3>
    <button id="checkoutBtn">前往結帳</button>
  </section>

  <section class="section" id="checkout">
    <h2>收件資料與結帳</h2>
    <form id="checkoutForm">
      <div class="form-grid">
        <div><label>收件人</label><input id="receiver" required></div>
        <div><label>聯絡電話（10碼數字）</label><input id="phone" required inputmode="numeric" maxlength="10" pattern="[0-9]{10}" placeholder="請輸入10碼電話"></div>
        <div><label>收件地址</label><input id="address" required></div>
        <div><label>付款方式</label><select id="payment" required><option value="">請選擇</option><option>貨到付款</option><option>銀行轉帳</option><option>信用卡</option></select></div>
      </div>
      <label>訂單備註</label><textarea id="note" rows="3"></textarea>
      <button type="submit">確認送出訂單</button>
    </form>
    <p class="small">訂單送出後會同步保存到雲端，後台可查看及更新訂單狀態。</p>
  </section>

  <section class="section" id="orders">
    <h2>我的訂單</h2>
    <div id="myOrders"><p>登入後即可查看自己的訂單。</p></div>
  </section>
</main>
<footer>© 墨栖服飾 MOXI</footer>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
import { SUPABASE_URL, SUPABASE_KEY } from "./config.js";

const message = (text, isError=false) => {
  const el = document.getElementById("authMessage");
  el.textContent = text;
  el.style.color = isError ? "#b42318" : "#39734b";
};
const configured = SUPABASE_URL.startsWith("https://") &&
  !SUPABASE_URL.includes("請貼上") && !SUPABASE_KEY.includes("請貼上");
if (!configured) {
  message("尚未設定雲端資料庫。請先依照資料夾內的設定說明，填入 Supabase URL 與 Publishable key。", true);
  document.getElementById("productList").textContent = "尚未連接雲端資料庫。";
  throw new Error("Supabase config missing");
}
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
const ACCOUNT_DOMAIN = "@moxi-demo.com";
let currentUser = null;
let currentProfile = null;
let cart = [];
let products = [];

function authEmail(account){ return account.trim().toLowerCase() + ACCOUNT_DOMAIN; }
function escapeText(value){ return String(value ?? ""); }
function money(value){ return Number(value || 0).toLocaleString("zh-TW"); }

async function loadProfile(user){
  const {data,error} = await supabase.from("profiles").select("id,name,account,role").eq("id",user.id).single();
  if(error) throw error;
  return data;
}
function updateAuthView(){
  document.getElementById("signedIn").hidden = !currentUser;
  document.getElementById("authForms").hidden = !!currentUser;
  document.getElementById("welcome").textContent = currentProfile ? `歡迎，${currentProfile.name}（${currentProfile.account}）` : "";
}
async function register(event){
  event.preventDefault();
  const name = document.getElementById("regName").value.trim();
  const account = document.getElementById("regAccount").value.trim();
  const password = document.getElementById("regPassword").value;
  if(!/^[A-Za-z0-9]+$/.test(account)){ message("帳號只能使用英文字母及數字，不可使用中文或符號。",true); return; }
  if(account.toLowerCase() === password.toLowerCase()){ message("帳號與密碼不能相同。",true); return; }
  if(password.length < 6){ message("密碼至少需要6個字元。",true); return; }
  const {data,error} = await supabase.auth.signUp({
    email: authEmail(account), password,
    options:{data:{name,account}}
  });
  if(error){ message(error.message.includes("already") ? "此帳號已註冊，請直接登入。" : "註冊失敗：" + error.message,true); return; }
  if(data.session){
    currentUser = data.user;
    try{ currentProfile = await loadProfile(currentUser); }catch(e){ message("帳戶已建立，請重新登入一次。",true); }
    updateAuthView(); await loadMyOrders();
    message("註冊成功！帳戶已保存，下次不用重新註冊。");
  }else{
    message("註冊資料已送出。請確認 Supabase 已關閉 Email confirmation，再重新登入。");
  }
  document.getElementById("registerForm").reset();
}
async function login(event){
  event.preventDefault();
  const account = document.getElementById("loginAccount").value.trim();
  const password = document.getElementById("loginPassword").value;
  if(!/^[A-Za-z0-9]+$/.test(account)){ message("帳號只能使用英文及數字。",true); return; }
  const {data,error} = await supabase.auth.signInWithPassword({email:authEmail(account),password});
  if(error){ message("登入失敗，請確認帳號密碼。",true); return; }
  currentUser = data.user;
  try{
    currentProfile = await loadProfile(currentUser);
    updateAuthView(); await loadMyOrders(); message("登入成功！");
  }catch(e){ message("讀取會員資料失敗：" + e.message,true); }
}
async function logout(){
  await supabase.auth.signOut();
  currentUser=null; currentProfile=null; updateAuthView();
  document.getElementById("myOrders").textContent="請先登入會員，即可查看自己的訂單。";
  message("已登出。");
}
async function loadProducts(){
  const {data,error}=await supabase.from("products").select("*").eq("active",true).order("created_at",{ascending:false});
  if(error){document.getElementById("productList").textContent="商品載入失敗："+error.message;return;}
  products=data||[];
  const list=document.getElementById("productList"); list.replaceChildren();
  if(!products.length){list.textContent="目前沒有上架商品。";return;}
  for(const p of products){
    const card=document.createElement("article");card.className="product";
    if(p.image_url){
      const img=document.createElement("img");img.src=p.image_url;img.alt=p.name;
      img.addEventListener("click",()=>openProductDetail(p));card.append(img);
    }
    const title=document.createElement("h3");title.textContent=p.name;
    title.addEventListener("click",()=>openProductDetail(p));
    const desc=document.createElement("p");desc.textContent=p.description||"";
    const price=document.createElement("p");price.className="price";price.textContent="$"+money(p.price);
    const detailBtn=document.createElement("button");detailBtn.className="detail-btn";detailBtn.textContent="查看商品";
    detailBtn.addEventListener("click",()=>openProductDetail(p));
    const btn=document.createElement("button");btn.textContent="加入購物車";
    btn.addEventListener("click",()=>addToCart(p));
    card.append(title,desc,price,detailBtn,btn);list.append(card);
  }
}
function addToCart(p){
  cart.push({id:p.id,name:p.name,price:Number(p.price)});
  renderCart();
}
function openProductDetail(p){
  const dialog=document.getElementById("productDialog");
  const content=document.getElementById("productDetailContent");
  content.replaceChildren();

  if(p.image_url){
    const img=document.createElement("img");
    img.className="detail-image";img.src=p.image_url;img.alt=p.name;
    content.append(img);
  }
  const title=document.createElement("h2");
  title.id="detailName";title.textContent=p.name;
  const price=document.createElement("p");
  price.className="price";price.textContent="$"+money(p.price);
  const description=document.createElement("p");
  description.textContent=p.description||"目前沒有商品介紹。";
  const actions=document.createElement("div");actions.className="detail-actions";
  const addBtn=document.createElement("button");addBtn.textContent="加入購物車";
  addBtn.addEventListener("click",()=>{addToCart(p);dialog.close();});
  actions.append(addBtn);
  content.append(title,price,description,actions);
  dialog.showModal();
}
function renderCart(){
  const box=document.getElementById("cartItems");box.replaceChildren();
  if(!cart.length){box.textContent="目前尚未選購商品";}else{
    cart.forEach((item,index)=>{
      const row=document.createElement("p");row.textContent=`${item.name}　$${money(item.price)}　`;
      const remove=document.createElement("button");remove.className="secondary";remove.textContent="移除";
      remove.addEventListener("click",()=>{cart.splice(index,1);renderCart();});row.append(remove);box.append(row);
    });
  }
  document.getElementById("cartTotal").textContent=money(cart.reduce((s,p)=>s+p.price,0));
}
async function checkout(event){
  event.preventDefault();
  if(!currentUser){message("請先登入會員再結帳。",true);document.getElementById("member").scrollIntoView();return;}
  if(!cart.length){message("購物車目前沒有商品。",true);return;}
  const receiver=document.getElementById("receiver").value.trim();
  const phone=document.getElementById("phone").value.trim();
  const address=document.getElementById("address").value.trim();
  const payment=document.getElementById("payment").value;
  const note=document.getElementById("note").value.trim();
  if(!/^[0-9]{10}$/.test(phone)){message("電話必須剛好輸入10碼數字。",true);return;}
  const total=cart.reduce((s,p)=>s+p.price,0);
  const {error}=await supabase.from("orders").insert({
    user_id:currentUser.id,member_account:currentProfile.account,receiver,phone,address,payment,note,total,
    items:cart.map(p=>({product_id:p.id,name:p.name,price:p.price,quantity:1}))
  });
  if(error){message("訂單送出失敗："+error.message,true);return;}
  cart=[];renderCart();document.getElementById("checkoutForm").reset();
  message("訂單成立！可至「我的訂單」查看狀況。");await loadMyOrders();
}
async function loadMyOrders(){
  const box=document.getElementById("myOrders");box.replaceChildren();
  if(!currentUser){box.textContent="登入後即可查看自己的訂單。";return;}
  const {data,error}=await supabase.from("orders").select("*").eq("user_id",currentUser.id).order("created_at",{ascending:false});
  if(error){box.textContent="訂單讀取失敗："+error.message;return;}
  if(!data?.length){box.textContent="目前沒有訂單紀錄。";return;}
  for(const order of data){
    const card=document.createElement("article");card.className="order";
    const h=document.createElement("h3");h.textContent="訂單編號："+order.id.slice(0,8).toUpperCase();
    const status=document.createElement("span");status.className="status";status.textContent=order.status;
    const detail=document.createElement("p");detail.textContent="商品："+(order.items||[]).map(x=>`${x.name} $${money(x.price)}`).join("、");
    const total=document.createElement("p");total.textContent="總金額：$"+money(order.total);
    const date=document.createElement("p");date.className="small";date.textContent="成立時間："+new Date(order.created_at).toLocaleString("zh-TW");
    card.append(h,status,detail,total,date);box.append(card);
  }
}
document.getElementById("registerForm").addEventListener("submit",register);
document.getElementById("loginForm").addEventListener("submit",login);
document.getElementById("logoutBtn").addEventListener("click",logout);
document.getElementById("checkoutBtn").addEventListener("click",()=>document.getElementById("checkout").scrollIntoView({behavior:"smooth"}));
document.getElementById("closeProductDialog").addEventListener("click",()=>document.getElementById("productDialog").close());
document.getElementById("productDialog").addEventListener("click",(event)=>{
  if(event.target===document.getElementById("productDialog")) document.getElementById("productDialog").close();
});
document.getElementById("checkoutForm").addEventListener("submit",checkout);

const {data:{session}}=await supabase.auth.getSession();
if(session){currentUser=session.user;try{currentProfile=await loadProfile(currentUser);}catch(e){}}
updateAuthView();await loadProducts();await loadMyOrders();
supabase.auth.onAuthStateChange(async(_event,session)=>{
  if(!session){currentUser=null;currentProfile=null;updateAuthView();return;}
  currentUser=session.user;
  try{currentProfile=await loadProfile(currentUser);updateAuthView();await loadMyOrders();}catch(e){}
});
supabase.channel("frontend-live")
  .on("postgres_changes",{event:"*",schema:"public",table:"orders"},()=>loadMyOrders())
  .on("postgres_changes",{event:"*",schema:"public",table:"products"},()=>loadProducts())
  .subscribe();
</script>
</body>
</html>
